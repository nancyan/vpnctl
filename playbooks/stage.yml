---
# Explicitly opt-in fresh VPS only. Copy config to an isolated staging directory.
# Does NOT enable, restart or reload any service.
- name: Stage offline-generated Xray configuration on fresh test VPS
  hosts: all
  gather_facts: true
  become: true
  serial: 1
  tasks:
    - name: Require explicit inventory designation for staging
      ansible.builtin.assert:
        that:
          - vpnctl_fresh_host | default(false) | bool
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: "Staging is restricted to expressly designated fresh Debian-family test hosts."

    - name: Verify manual test host authorization marker
      ansible.builtin.stat:
        path: /etc/vpnctl-allow-bootstrap
      register: stage_marker

    - name: Refuse without authorization marker
      ansible.builtin.assert:
        that:
          - stage_marker.stat.exists
          - stage_marker.stat.isreg

    - name: Check for 3x-ui service
      ansible.builtin.command: systemctl list-unit-files x-ui.service --no-legend
      register: stage_xui
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to interfere with 3x-ui managed nodes
      ansible.builtin.assert:
        that:
          - stage_xui.stdout | trim == ''
        fail_msg: "3x-ui installed: do not stage standalone Xray here."

    - name: Require explicit local rendered bundle
      ansible.builtin.assert:
        that:
          - vpnctl_bundle is defined
          - vpnctl_bundle | length > 0
        fail_msg: "Provide a private rendered bundle path with vpnctl --bundle."

    - name: Verify exact node file exists on controller
      ansible.builtin.stat:
        path: "{{ vpnctl_bundle }}/{{ inventory_hostname }}/xray.json"
      become: false
      delegate_to: localhost
      register: source_cfg

    - name: Refuse node mismatch or missing file
      ansible.builtin.assert:
        that:
          - source_cfg.stat.exists
          - source_cfg.stat.isreg
        fail_msg: "No generated xray.json for this inventory hostname; refusing."

    - name: Create restricted staging directory
      ansible.builtin.file:
        path: /etc/vpnctl/staged
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Stage configuration, leaving live services untouched
      ansible.builtin.copy:
        src: "{{ vpnctl_bundle }}/{{ inventory_hostname }}/xray.json"
        dest: /etc/vpnctl/staged/xray.json
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Check standalone Xray binary presence
      ansible.builtin.stat:
        path: /usr/local/bin/xray
      register: local_xray

    - name: Validate staged config with Xray if binary exists
      ansible.builtin.command:
        argv: [/usr/local/bin/xray, run, -test, -config, /etc/vpnctl/staged/xray.json]
      changed_when: false
      when: local_xray.stat.exists
      no_log: true

    - name: Report staging status without leaking credentials
      ansible.builtin.debug:
        msg: "Staged {{ inventory_hostname }}. Validation {{ 'passed' if local_xray.stat.exists else 'not run (Xray absent)' }}. No services changed."
