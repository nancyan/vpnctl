name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml
      - name: Python checks
        run: |
          python -m compileall -q vpnctl.py tests
          python -m unittest discover -s tests -v
      - name: Ansible syntax checks (offline)
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook -i inventory/hosts.yml --syntax-check "$playbook"
          done
